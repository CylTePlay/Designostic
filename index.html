<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Designostic</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100svh; display: flex; flex-direction: column; align-items: center; font-family: system-ui, sans-serif; background: linear-gradient(#e6d5b8, #fff 240px) no-repeat; }
      main { flex: 1; width: 100%; max-width: 576px; overflow-y: auto; }
      section { min-height: 100%; display: flex; flex-direction: column; gap: 1.25rem; padding: 2rem 1.25rem 1rem; }
      section[hidden], footer[hidden] { display: none; }
      h1 { margin: 0; text-align: center; text-wrap: balance; line-height: 1.15; font-size: 1.5rem; font-style: italic; }
      h2 { margin: 0; text-align: center; color: #777; font-size: 1.25rem; font-style: italic; }
      .hint { margin: 0; text-align: center; font-size: 14px; font-style: italic; color: #777; }
      .field { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
      input[type="text"], select { width: 100%; max-width: 300px; border: 1px solid #a01cc0; border-radius: 99px; background: #fff; padding: 0.6rem 1rem; font-family: inherit; font-size: 1rem; font-style: italic; text-align: center; }
      .btn { border: 0; border-radius: 99px; background: #e44dff; color: #fff; padding: 0.5rem 2rem; font-family: inherit; font-size: 1rem; font-style: italic; cursor: pointer; }
      .btn:disabled { opacity: 0.4; }
      .ghost { background: #fff; color: #e44dff; border: 1px solid #e44dff; }
      .opt { display: flex; align-items: center; gap: 0.75rem; width: 100%; margin-bottom: 0.75rem; padding: 0.8rem 1rem; border: 0; border-radius: 28px; background: #fdf3dc; color: #000; text-align: left; font: 600 0.95rem system-ui, sans-serif; cursor: pointer; }
      .opt.on { background: linear-gradient(326deg, #a21cbf, #c04ddb); color: #fff; }
      .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #c04ddb; background: #fff; }
      .on .dot { background: linear-gradient(#f0a0ff, #d05be8); }
      .arrows { display: flex; flex-direction: column; }
      .arrows button { all: unset; cursor: pointer; line-height: 1; padding: 2px 8px; }
      .sl { display: block; margin-bottom: 1.4rem; font-weight: 600; font-size: 0.95rem; }
      .gauge { position: relative; display: block; height: 36px; margin-top: 0.5rem; }
      .track, .fill { position: absolute; top: 50%; height: 24px; margin-top: -12px; border-radius: 99px; filter: url(#grain); }
      .track { left: 0; right: 0; background: #fdf3dc; }
      .fill { left: 0; width: calc(18px + (100% - 36px) * var(--v)); background: linear-gradient(90deg, #e87cff 40%, #9a39b2); }
      .thumb { position: absolute; top: 0; left: calc((100% - 36px) * var(--v)); width: 36px; height: 36px; border: 4px solid transparent; border-radius: 50%; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(160deg, #9a39b2, #e870ff) border-box; pointer-events: none; }
      .gauge input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; appearance: none; -webkit-appearance: none; background: transparent; touch-action: pan-y; }
      .gauge input::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; }
      .gauge input::-moz-range-thumb { width: 36px; height: 36px; border: 0; }
      .gauge:has(input:focus-visible) .thumb { outline: 3px solid #6b00a8; outline-offset: 3px; }
      
      footer { display: flex; justify-content: space-between; width: 100%; max-width: 576px; padding: 1rem 1.25rem 1.5rem; }
    
      body { height: 100vh; height: 100dvh; }
      section { padding-top: max(1.5rem, env(safe-area-inset-top)); }
      h1 { font-size: clamp(1.2rem, 5.2vw, 1.6rem); }
      h1:focus { outline: none; }
      footer { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
      .btn { background: #b71fd6; min-height: 44px; }
      .ghost { background: #fff; color: #b71fd6; border: 1px solid #b71fd6; }
      .hint { color: #666; }
      :focus-visible { outline: 3px solid #6b00a8; outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .opt { min-height: 48px; transition: transform 0.15s; }
      .arrows button { font-size: 1.1rem; padding: 4px 12px; }
      .rank .opt { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
      .opt.drag { transition: none; position: relative; z-index: 2; cursor: grabbing; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
      @media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <section style="justify-content: space-between">
        <div></div>
        <div style="text-align: center">
          <h1 style="font-size: 2rem">Designostic</h1>
          <p style="font-size: 1.2rem">La plateforme de positionnement design pour les partenaires de l'EDNA</p>
        </div>
        <div>
          <label style="display: flex; gap: 1rem; align-items: center; font-size: 14px; font-style: italic; margin-bottom: 1rem">
            <input type="checkbox" id="consent" style="width: 24px; height: 24px; flex: none" />
            Je consens à ce que mes données soient utilisées par le personnel de l'EDNA à des fins de recherche
          </label>
          <button class="btn" id="start" style="width: 100%; font-size: 1.5rem">Commencer</button>
        </div>
      </section>
      <section>
        <h1 style="margin-top: 3rem">Qui êtes-vous ?</h1>
        <div class="field"><label for="company">Nom de votre société :</label><input type="text" id="company" /></div>
        <div class="field"><label for="secteur">Secteur d'activité :</label><select id="secteur"></select></div>
      </section>
      <section>
        <h1 style="margin-top: 3rem">Qui êtes-vous ?</h1>
        <div class="field"><label for="fullname">Votre nom et prénom :</label><input type="text" id="fullname" /></div>
        <div class="field"><label for="poste">Votre poste :</label><input type="text" id="poste" /></div>
      </section>
      <section id="result" style="justify-content: center; align-items: center">
        <h1>Votre vision du profil du designer :</h1>
        <div id="shapes" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.5rem"></div>
        <p id="res-text" style="text-align: center; font-style: italic"></p>
      </section>
    </main>
    <div id="live" class="sr" aria-live="polite"></div>
    <footer>
      <button class="btn ghost" id="prev">Précédent</button>
      <button class="btn" id="next">Suivant ✓</button>
    </footer>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="grain" x="-5%" y="-60%" width="110%" height="220%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="0.4" />
      </filter>
    </svg>
    <script>
      const [A, T, R, S] = ["artistique", "technique", "recherche", "strategique"];
      const NAMES = { [A]: "artistique", [T]: "technique", [R]: "académique", [S]: "stratégique" };
      const COLORS = { [A]: "#f4845f", [T]: "#d956f0", [R]: "#5b8ee6", [S]: "#b8b52a" };
      const SHAPES = {
        [A]: "polygon(50% 0,61% 20%,85% 15%,80% 40%,100% 50%,80% 60%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 60%,0 50%,20% 40%,15% 15%,39% 20%)",
        [T]: "polygon(50% 0,100% 100%,0 100%)",
        [R]: "none",
        [S]: "circle(50%)",
      };
      const URL_POST = "https://designostic.kothar.tools/data";
      const HINTS = { single: "1 réponse possible", multi: "Plusieurs réponses possibles", sliders: "Jaugez l'importance de chaque réponse", rank: "Classez les réponses par ordre d'importance" };
      const CHECK = "Cochez la ou les éléments puis validez votre réponse";
      const SECTEURS = "Administration/Fonction publique|Studio de Design/Indépendant|Agroalimentaire|Armement/Défense|Artisanat d'art|Associations|Automobile|Banques/Assurances/Mutuelles|Commerce/Distribution/Equipement|Collectivités locales & territoriales|Communication/Marketing/Publicité|Conseil/Audit/Etude|Construction/Bâtiment/Travaux Publics|Cosmétique|Culture/Sports/Loisirs|Energie|Enseignement/Formation|Environnement|Gestion/Administration des entreprises|Hôtellerie/Restauration/Tourisme|Immobilier|Informatique/Télécommunications|Instituts de recherche|Luxe|Medias/Presse/Edition|Numérique|Professions juridiques|Vente/E-commerce/Internet|Santé/Action sociale|Textile/Mode|Transports/Logistique".split("|");

      // items : [libellé, profil, exclusif?]  (profil absent = question de profil, non notée)
      const L = (...a) => a.map(([label, type, exclusive]) => ({ label, type, exclusive }));
      const IN = "Dans votre entreprise…";

      // mode : single (1 réponse) | multi (plusieurs) | sliders | rank (classement)
      const Q = [
        { id: "employs", kicker: "Votre profil", title: "Votre entreprise emploie-t-elle des designers ?", mode: "multi", hint: CHECK,
          items: L(["Salarié.e(s)"], ["Freelance.e(s)"], ["Alternant.e(s)"], ["Stagiaire(s)"], ["Je n'emploie pas de designer", 0, 1]) },
        { id: "filieres", kicker: "Votre profil", title: "De quelle(s) filière(s) de l'école proviennent-ils.elles ?", mode: "multi", hint: CHECK,
          items: L(["Graphisme/Motion"], ["UI/UX design"], ["Game Experience Design"], ["Architecture d'intérieur"], ["Scénographie"], ["Design produit/industriel"], ["Design textile/mode"]) },
        { id: "role", kicker: IN, title: "Quel rôle le·la designer occupe-t-il·elle principalement ?", mode: "sliders",
          items: L(["Veiller à l'esthétique et à l'identité visuelle des produits ou services", A], ["Produire des contenus de communication", A], ["Concevoir et produire des maquettes et des prototypes", T], ["Adapter les créations aux contraintes techniques et aux procédés de fabrication", T], ["Étudier les besoins des usagers", R], ["Analyser et exploiter les données disponibles", R]) },
        { id: "collab", kicker: IN, title: "Avec qui la·le designer est-il.elle amené à travailler le plus souvent ?", mode: "multi",
          items: L(["Les pairs (illustrateurs, designers sonores, scénographes, artistes)", A], ["Les community managers et créateurs de contenu (réseaux sociaux)", S], ["Les ingénieurs et le service R&D", T], ["Les fabricants et prestataires techniques (développeurs, imprimeurs…)", T], ["Chercheurs et experts académiques (urbanistes, sociologues, psychologues)", R], ["Usagers ou utilisateurs des produits et services", R], ["Les commanditaires et clients du projet", S]) },
        { id: "competences", kicker: IN, title: "Quelle importance accordez-vous à chacune de ces compétences chez un·e designer ?", mode: "rank",
          items: L(["Avoir une culture artistique solide et un sens de l'esthétique affirmé", A], ["Percevoir les tendances actuelles et futures du marché", S], ["Maîtriser les nouveaux outils et technologies", T], ["Comprendre finement les usagers et leurs besoins", R]) },
        { id: "outils", kicker: IN, title: "Quel(s) outil(s) le.la designer utilise-t-il.elle le plus ?", mode: "sliders",
          items: L(["Outils d'expression visuelle (Dessin, Suite Adobe, CAO…).", A], ["Outils de conception / fabrication.(Logiciel 3D, Maquette, Atelier Fab).", T], ["Outils de recherche (Google Scholar, Cairn, sondages, Entretiens, Observations terrain…)", R], ["Outils de gestion projet (Suite Office, Trello, Notion, Canva, Ateliers collaboratifs…)", S]) },
        { id: "dessin", kicker: IN, title: "Les designers utilisent principalement le dessin pour :", mode: "single",
          items: L(["Représenter un univers visuel et donner une identité graphique aux projets", A], ["Produire des plans, des schémas techniques et des dessins de conception", T], ["Organiser des idées, clarifier des concepts complexes et structurer un raisonnement (schéma, brainstorming)", R], ["Communiquer des idées auprès des collaborateurs et des clients (personas, parcours utilisateurs…)", S]) },
        { id: "ia", kicker: IN, title: "Il est principalement attendu que la·le designer utilise l'IA pour :", mode: "multi",
          items: L(["Trouver et explorer des inspirations et des nouvelles pistes créatives", A], ["Générer des contenus audio/vidéos, des visuels, des rendus 3D, etc…", T], ["Rechercher de l'information et approfondir certaines notions et connaissances complexes", R], ["Structurer, analyser et synthétiser des données pour mieux les communiquer ensuite", S], ["Nous ne souhaitons pas que nos designers utilisent l'IA", 0, 1]) },
        { id: "garant", kicker: IN, title: "Le.la designer est avant-tout garant.e de :", mode: "sliders",
          items: L(["De la qualité esthétique du produit ou du service", A], ["Des contraintes techniques, organisationnelles et budgétaires", T], ["Du respect des usagers, notamment des enjeux éthiques, d'accessibilité et d'inclusivité", R], ["De l'adéquation du projet avec les attentes du client et les besoins du marché", S]) },
        { id: "graphiste", kicker: IN, title: "Si vous deviez aujourd'hui faire appel à un designer graphique, attendriez-vous d'abord qu'il.elle :", mode: "single",
          items: L(["Applique son univers graphique à vos produits", A], ["S'adapte à l'identité visuelle de votre entreprise", T], ["Explore de nouvelles approches, techniques et formes d'expression", R], ["Fasse évoluer l'identité visuelle de votre entreprise pour soutenir son positionnement et ses évolutions", S]) },
        { id: "cas", kicker: "Cas pratique", title: "Vous travaillez à la conception d'un nouveau produit. À quelle étape du projet un.e designer devrait-il.elle consacrer le plus de temps ?", mode: "rank",
          items: L(["La collecte et l'analyse de données terrain (observations, entretiens, tests utilisateurs, synthèse)", R], ["Le prototypage du produit en répondant à un cahier des charges et des contraintes techniques imposées", T], ["L'identification des opportunités pour orienter le positionnement du produit sur un marché", S], ["L'identité visuelle, la mise en récit et la communication du produit", A]) },
        { id: "formation", kicker: "Selon ce que vous observez…", title: "De quel domaine de formation le.la designer se rapproche-t-il.elle le plus?", mode: "single",
          items: L(["Artisanat et arts plastiques", A], ["Ingénierie et sciences informatiques", T], ["Sciences humaines, psychologiques et sociales", R], ["Commerce, marketing et communication", S]) },
      ];

      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => "&#" + c.charCodeAt(0) + ";");
      const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      // état : single → index | multi → [index] | sliders → [0..1] | rank → [index] dans l'ordre
      const state = {};
      Q.forEach((q) => {
        state[q.id] = q.mode === "sliders" ? q.items.map(() => 0.5) : q.mode === "rank" ? shuffle(q.items.map((_, k) => k)) : q.mode === "multi" ? [] : null;
      });

      SECTEURS.forEach((s) => $("#secteur").add(new Option(s, s)));
      $("#secteur").insertAdjacentHTML("afterbegin", '<option value="">...</option>');
      $("#secteur").value = "";

      function build(q) {
        const el = document.createElement("section");
        el.innerHTML = `<h2>${q.kicker}</h2><h1 id="h-${q.id}" tabindex="-1">${q.title}</h1><p class="hint">${q.hint || HINTS[q.mode]}</p><div></div>`;
        const body = el.lastChild;
        body.setAttribute("role", q.mode === "single" ? "radiogroup" : "group");
        body.setAttribute("aria-labelledby", "h-" + q.id);
        if (q.mode === "rank") body.classList.add("rank");
        const draw = () => {
          const st = state[q.id];
          body.innerHTML =
            q.mode === "sliders"
              ? q.items.map((it, k) => `<label class="sl">${it.label}<span class="gauge" style="--v:${st[k]}"><span class="track"></span><span class="fill"></span><span class="thumb"></span><input type="range" min="0" max="100" data-k="${k}" value="${st[k] * 100}" aria-valuetext="${Math.round(st[k] * 100)} %" /></span></label>`).join("")
              : q.mode === "rank"
              ? `<p class="hint" style="text-align:left">Le plus important</p>` +
                st.map((idx, p) => `<div class="opt on"><span class="arrows"><button data-p="${p}" data-d="-1" aria-label="Monter : ${q.items[idx].label}">▲</button><button data-p="${p}" data-d="1" aria-label="Descendre : ${q.items[idx].label}">▼</button></span>${q.items[idx].label}</div>`).join("")
              : q.items.map((it, k) => { const on = q.mode === "single" ? st === k : st.includes(k); return `<button class="opt${on ? " on" : ""}" data-k="${k}" ${q.mode === "single" ? `role="radio" aria-checked="${on}"` : `aria-pressed="${on}"`}><span class="dot" aria-hidden="true"></span>${it.label}</button>`; }).join("");
        };
        body.onclick = (e) => {
          const b = e.target.closest("[data-k],[data-p]");
          if (!b) return;
          const st = state[q.id];
          if (b.dataset.p) {
            const p = +b.dataset.p, d = +b.dataset.d;
            if (p + d < 0 || p + d >= st.length) return;
            [st[p], st[p + d]] = [st[p + d], st[p]];
          } else if (q.mode === "single") state[q.id] = +b.dataset.k;
          else if (q.mode === "multi") {
            const k = +b.dataset.k;
            state[q.id] = st.includes(k) ? st.filter((x) => x !== k) : q.items[k].exclusive ? [k] : [...st.filter((x) => !q.items[x].exclusive), k];
          } else return;
          draw();
          if (b.dataset.p) {
            const np = +b.dataset.p + +b.dataset.d;
            body.querySelector(`[data-p="${np}"][data-d="${b.dataset.d}"]`)?.focus();
            $("#live").textContent = `Position ${np + 1} sur ${state[q.id].length}`;
          } else body.querySelector(`[data-k="${b.dataset.k}"]`)?.focus();
        };
        body.oninput = (e) => {
          const v = e.target.value / 100;
          state[q.id][+e.target.dataset.k] = v;
          e.target.parentNode.style.setProperty("--v", v);
          e.target.setAttribute("aria-valuetext", Math.round(v * 100) + " %");
        };
        // Glisser-déposer (souris + doigt) pour les classements
        body.onpointerdown = (e) => {
          if (q.mode !== "rank" || e.button > 0 || e.target.closest("button")) return;
          const card = e.target.closest(".opt");
          if (!card) return;
          const items = [...body.querySelectorAll(".opt")], from = items.indexOf(card);
          const rects = items.map((x) => x.getBoundingClientRect());
          const h = rects[from].height + 12, y0 = e.clientY;
          let to = from;
          card.setPointerCapture(e.pointerId);
          card.classList.add("drag");
          card.onpointermove = (ev) => {
            const dy = ev.clientY - y0, cy = rects[from].top + rects[from].height / 2 + dy;
            card.style.transform = `translateY(${dy}px)`;
            const t = rects.findIndex((r) => cy < r.bottom);
            to = t < 0 ? items.length - 1 : t;
            items.forEach((it, k) => {
              if (k !== from) it.style.transform = from < to && k > from && k <= to ? `translateY(${-h}px)` : from > to && k >= to && k < from ? `translateY(${h}px)` : "";
            });
          };
          card.onpointerup = () => {
            const st = state[q.id];
            st.splice(to, 0, st.splice(from, 1)[0]);
            draw();
            $("#live").textContent = `Position ${to + 1} sur ${st.length}`;
          };
          card.onpointercancel = () => draw();
        };
        draw();
        return el;
      }

      // ---------- Calcul : chaque question pèse exactement 1 (somme des 4 profils = 1) ----------
      function vec(q) {
        const st = state[q.id], v = { [A]: 0, [T]: 0, [R]: 0, [S]: 0 };
        if (q.mode === "rank") {
          // 1er = 100 %, 2e = 50 %, 3e = 25 %, dernier = 0 %
          st.forEach((idx, p) => { const t = q.items[idx].type; if (t) v[t] += [1, 0.5, 0.25, 0][p] ?? 0; });
        } else {
          // force moyenne par profil (évite qu'un profil avec plus d'items pèse davantage)
          const n = {}, sum = {};
          q.items.forEach((it, k) => {
            if (!it.type) return;
            n[it.type] = (n[it.type] || 0) + 1;
            sum[it.type] = (sum[it.type] || 0) + (q.mode === "sliders" ? st[k] : q.mode === "single" ? +(st === k) : +st.includes(k));
          });
          for (const t in n) v[t] = sum[t] / n[t];
        }
        const tot = Object.values(v).reduce((a, b) => a + b, 0);
        return tot > 0 ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, x / tot])) : null; // null = question sans signal (profil, « pas d'IA »)
      }

      const read = (q) => {
        const st = state[q.id], lab = (k) => q.items[k].label;
        return q.mode === "sliders" ? q.items.map((it, k) => ({ label: it.label, value: st[k] })) : q.mode === "rank" ? st.map(lab) : q.mode === "single" ? lab(st) : st.map(lab);
      };

      let sent = false;
      function finish() {
        if (sent) return;
        sent = true;
        const vs = Q.map(vec).filter(Boolean);
        const g = (id) => $("#" + id).value.trim();
        const info = {
          consent: $("#consent").checked, company: g("company"), secteur: $("#secteur").value, fullname: g("fullname"), poste: g("poste"),
          employs: read(Q[0]), filieres: read(Q[1]), answers: Object.fromEntries(Q.map((q) => [q.id, read(q)])), date: Date.now(),
        };
        for (const k of [A, T, R, S]) info[k] = vs.reduce((a, v) => a + v[k], 0) / (vs.length || 1);
        fetch(URL_POST, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(info) }).catch(console.error);

        $("#shapes").innerHTML = [A, T, S, R].map((k) => {
          const p = Math.round(info[k] * 100), w = Math.round(70 + info[k] * 230);
          return `<div style="width:min(${w}px,58vw);aspect-ratio:1;background:${COLORS[k]};clip-path:${SHAPES[k]};display:grid;place-content:center;text-align:center;color:rgba(0,0,0,.55);font-style:italic"><b style="font-size:${14 + p * 0.5}px">${p}%</b><small>${NAMES[k]}</small></div>`;
        }).join("");
        const top = [A, T, R, S].sort((a, b) => info[b] - info[a])[0];
        const name = NAMES[top][0].toUpperCase() + NAMES[top].slice(1);
        $("#res-text").innerHTML = `${esc(info.fullname)} (${esc(info.company)}),<br />pour votre entreprise, le designer a avant-tout un profil<br /><b style="font-size:2rem;color:${COLORS[top]}">${name} !</b>`;
      }

      // ---------- Navigation ----------
      $("#result").before(...Q.map(build));
      const main = $("main"), next = $("#next"), foot = $("footer");
      const slides = [...main.children];
      let cur = 0;
      const valid = (n) => {
        if (n === 1) return !!$("#company").value.trim();
        if (n === 2) return !!$("#fullname").value.trim();
        const q = Q[n - 3];
        if (!q) return true;
        const st = state[q.id];
        return q.mode === "single" ? st !== null : q.mode === "multi" ? st.length > 0 : true;
      };
      function go(n) {
        cur = n;
        slides.forEach((s, k) => (s.hidden = k !== n));
        foot.hidden = n === 0 || n === slides.length - 1;
        next.disabled = !valid(n);
        main.scrollTop = 0;
        const hd = slides[n].querySelector("h1");
        if (hd) { hd.tabIndex = -1; hd.focus({ preventScroll: true }); }
        if (n === slides.length - 1) finish();
      }
      main.addEventListener("click", () => (next.disabled = !valid(cur)));
      main.addEventListener("input", () => (next.disabled = !valid(cur)));
      $("#start").onclick = () => go(1);
      next.onclick = () => go(cur + 1);
      $("#prev").onclick = () => go(cur - 1);
      go(0);
    </script>
  </body>
</html>
